<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appointments — Aarogya Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/patient.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" data-ao-sidebar></aside>
  <div class="main-area">
    <div data-ao-mobile-nav></div>
    <div class="topbar"><h1>Appointments</h1></div>
    <main id="main" class="page-content">
      <div class="grid grid-sidebar">
        <div class="card">
          <h3>Your appointments</h3>
          <div id="appointments-list"></div>
        </div>
        <div class="card">
          <h3>Request a follow-up</h3>
          <form id="request-followup-form">
            <div class="field">
              <label for="fu-date">Preferred date</label>
              <input type="date" id="fu-date" required />
            </div>
            <div class="field">
              <label for="fu-reason">Reason</label>
              <input type="text" id="fu-reason" placeholder="e.g. Follow-up on headache treatment" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send request</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/appointments.js"></script>
<script>aoRenderAppointmentsPage();</script>
</body>
</html>
