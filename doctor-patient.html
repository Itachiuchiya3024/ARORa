<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient Case — Aarogya Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" data-ao-sidebar></aside>
  <div class="main-area">
    <div data-ao-mobile-nav></div>
    <div class="topbar">
      <h1>Patient Case</h1>
      <a href="doctor-dashboard.html" class="btn btn-ghost btn-sm">← Back to patients</a>
    </div>
    <main id="main" class="page-content">
      <div class="card flex items-center gap-4" id="dpv-header" style="margin-bottom:24px;"></div>

      <div class="grid grid-sidebar">
        <div>
          <div class="card" style="margin-bottom:20px;">
            <h3>AI Case Summary</h3>
            <div id="dpv-ai-summary"></div>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h3>Case details (patient-reported)</h3>
            <div id="dpv-case-detail"></div>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h3>Record consultation</h3>
            <form id="consultation-form">
              <div class="grid grid-2">
                <div class="field">
                  <label for="cf-system">Care system</label>
                  <select id="cf-system">
                    <option>Modern Medicine</option>
                    <option>Ayurveda</option>
                    <option>Yoga &amp; Naturopathy</option>
                    <option>Unani</option>
                    <option>Siddha</option>
                    <option>Sowa-Rigpa</option>
                    <option>Other AYUSH</option>
                  </select>
                </div>
                <div class="field">
                  <label for="cf-followup">Follow-up date</label>
                  <input type="date" id="cf-followup" />
                </div>
              </div>
              <div class="field">
                <label for="cf-diagnosis">Diagnosis / clinical impression</label>
                <input type="text" id="cf-diagnosis" placeholder="e.g. Tension-type headache" required />
              </div>
              <div class="field">
                <label for="cf-plan">Treatment plan</label>
                <textarea id="cf-plan" rows="3" placeholder="e.g. Hydration, sleep hygiene, Paracetamol 500mg SOS" required></textarea>
              </div>
              <div class="field">
                <label for="cf-investigations">Investigations (comma separated)</label>
                <input type="text" id="cf-investigations" placeholder="e.g. CBC, Vitamin D" />
              </div>
              <div class="field">
                <label for="cf-notes">Doctor notes</label>
                <textarea id="cf-notes" rows="2" placeholder="Additional notes for the record"></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Save consultation</button>
            </form>
          </div>
        </div>

        <div>
          <div class="card" style="margin-bottom:20px;">
            <h3>Known history</h3>
            <div id="dpv-history"></div>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h3>Treatment history</h3>
            <div id="dpv-rx-history"></div>
          </div>
          <div class="card">
            <h3>Health timeline</h3>
            <div id="dpv-timeline"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/ai.js"></script>
<script src="js/doctor.js"></script>
<script>aoRenderDoctorPatientView();</script>
</body>
</html>
