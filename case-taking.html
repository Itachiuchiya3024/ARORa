<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health Check — Aarogya Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/patient.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" data-ao-sidebar></aside>
  <div class="main-area">
    <div data-ao-mobile-nav></div>
    <div class="topbar">
      <h1>Health Check with ORBIT</h1>
    </div>
    <main id="main" class="page-content" style="max-width:760px;">
      <p class="text-muted">ORBIT will ask a few structured questions to prepare your case. It organizes what you share — it does not diagnose or prescribe. A doctor will review everything before any treatment decision.</p>

      <div class="card" style="padding:0; overflow:hidden;">
        <div class="chat-progress">
          <div class="flex justify-between items-center" style="margin-bottom:6px;">
            <small id="chat-progress-label">Step 1 of 8</small>
          </div>
          <div class="chat-progress-bar"><div id="chat-progress-fill" style="width:0%"></div></div>
        </div>
        <div class="chat-window">
          <div class="chat-log" id="chat-log"></div>
          <div class="chat-quick-replies" id="chat-quick-replies"></div>
          <form class="chat-input-row" id="chat-form">
            <input type="text" id="chat-text-input" placeholder="Type your answer..." autocomplete="off" />
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </div>

      <div id="chat-review" style="display:none; margin-top:20px;"></div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/ai.js"></script>
<script>
  const session = AoSession.requireRole(["patient"]);
  if(session){
    aoRenderShell("case-taking");
    document.body.classList.add("mode-" + (session.mode || "classic"));

    AoChat.init();

    document.getElementById("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("chat-text-input");
      if(!input.value.trim()) return;
      AoChat.submitAnswer(input.value);
      input.value = "";
    });
  }
</script>
</body>
</html>
